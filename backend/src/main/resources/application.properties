spring.application.name=sb-ecom

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecommerce}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

project.image=images/

spring.app.jwtSecret=${JWT_SECRET:bG9jYWwtZGV2LW9ubHktand0LXNlY3JldC1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi0xMjM0NTY3OA==}
spring.app.jwtExpirationMs=300000000
spring.ecom.app.jwtCookieName=springBootEcom
jwt.cookie.secure=${JWT_COOKIE_SECURE:false}

frontend.url=${FRONTEND_URL:http://localhost:5173}
image.base.url=${IMAGE_BASE_URL:http://localhost:8080/images}

stripe.secret.key=${STRIPE_SECRET_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
stripe.currency=${STRIPE_CURRENCY:usd}

upstash.redis.rest.url=${UPSTASH_REDIS_REST_URL:}
upstash.redis.rest.token=${UPSTASH_REDIS_REST_TOKEN:}

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
